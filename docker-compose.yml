# =============================================================================
# SupplySight AI — Docker Compose (scaffold)
# Purpose: Define multi-service local/dev topology. No business services wired yet.
# Services planned: frontend (Next.js), backend (FastAPI), postgres (PostgreSQL).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — system of record for transactional and analytical data
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: supplysight-postgres
    restart: unless-stopped
    # env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplysight}
      POSTGRES_USER: ${POSTGRES_USER:-supplysight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_securely}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supplysight} -d ${POSTGRES_DB:-supplysight}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - supplysight-net

  # ---------------------------------------------------------------------------
  # Backend — FastAPI application (Dockerfile to be added under docker/backend)
  # Uncomment and complete when backend containerization begins.
  # ---------------------------------------------------------------------------
  # backend:
  #   build:
  #     context: .
  #     dockerfile: docker/backend/Dockerfile
  #   container_name: supplysight-backend
  #   restart: unless-stopped
  #   env_file: .env
  #   ports:
  #     - "${API_PORT:-8000}:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - supplysight-net

  # ---------------------------------------------------------------------------
  # Frontend — Next.js application (Dockerfile to be added under docker/frontend)
  # Uncomment and complete when frontend containerization begins.
  # ---------------------------------------------------------------------------
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: docker/frontend/Dockerfile
  #   container_name: supplysight-frontend
  #   restart: unless-stopped
  #   env_file: .env
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   networks:
  #     - supplysight-net

volumes:
  postgres_data:
    # Persists PostgreSQL data across container recreations
    name: supplysight_postgres_data

networks:
  supplysight-net:
    # Shared bridge network for SupplySight services
    name: supplysight-net
    driver: bridge
